name: Build & deploy

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  call-build-and-deploy:
    uses: navikt/toi-github-actions-workflows/.github/workflows/build-and-deploy.yaml@v17 # zizmor: ignore[ref-confusion,unpinned-uses]
    with:
      java-version: "25"
      deploy-to-dev-if-branch-name-is: 'deploy-til-gcp'
      baseimage-tagged-ref: europe-north1-docker.pkg.dev/cgr-nav/pull-through/nav.no/jre:openjdk-25
    permissions:
      contents: read
      id-token: write
