name: Deploy dvh-topic to dev

on:
  push:
    branches:
      - master
      - oppgrader-workflows-og-shapin-versjonene
    paths:
      - .github/workflows/deploy-dvh-topic-to-dev.yaml
      - nais/dvh-topic-dev.yaml

jobs:
  deploy-kandidat-topic-to-dev:
    permissions:
      id-token: write
    name: Deploy dvh-topic to dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: dev-gcp
          RESOURCE: nais/dvh-topic-dev.yaml
