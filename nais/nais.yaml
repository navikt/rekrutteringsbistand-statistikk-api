apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: rekrutteringsbistand-statistikk-api
  namespace: toi
  labels:
    team: toi
spec:
  image: {{ image }}
  port: 8080
  ingresses:
  {{#each ingress as |url|}}
    - {{ url }}
  {{/each}}
  liveness:
    path: /isalive
    initialDelay: 30
  readiness:
    path: /isready
    initialDelay: 20
  prometheus:
    enabled: true
    path: /rekrutteringsbistand-statistikk-api/metrics
  replicas:
    min: {{ min_replicas }}
    max: {{ max_replicas }}
    cpuThresholdPercentage: 75
  resources:
    limits:
      memory: {{ memory_limit }}
    requests:
      cpu: {{ requested_cpu }}
      memory: {{ requested_memory }}
  accessPolicy:
    inbound:
      rules:
      {{#each inbound_applications as |app|}}
        - application: {{ app }}
      {{/each}}
    outbound:
      rules:
        - application: logging
          namespace: nais-system
  kafka:
    pool: {{ kafka_pool }}
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        tier: {{ gcp_db_tier }}
        diskAutoresize: {{ gcp_disk_autoresize }}
        pointInTimeRecovery: {{ gcp_db_point_in_time_recovery }}
        databases:
          - name: rekrutteringsbistand-statistikk
            envVarPrefix: DB
  azure:
    application:
      enabled: true
      allowAllUsers: false
      claims:
        extra:
          - NAVident
        groups:
          - id: {{ adGruppeModiaGenerellTilgang }}
          - id: {{ adGruppeJobbsokerrettet }}
          - id: {{ adGruppeArbeidsgiverrettet }}
          - id: {{ adGruppeUtvikler }}
  env:
    - name: KAFKA_RAPID_TOPIC
      value: toi.rapid-1
    - name: KAFKA_CONSUMER_GROUP_ID
      value: {{ kafka_consumer_group_id }}
    - name: KAFKA_RESET_POLICY
      value: "earliest"
    - name: HTTP_PORT
      value: "8080"
    - name: KUN_FLYWAY_MIGRERING
      value: "{{ kun_flyway_migrering }}"
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: loki
        - id: elastic
      enabled: true
